[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filo_hft"
version = "0.1.0"
description = "Research + tooling for the FiloHFT XAUUSD low-latency platform"
requires-python = ">=3.10"
authors = [{ name = "FiloHFT" }]
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "joblib>=1.3",
  "MetaTrader5>=5.0.45; platform_system=='Windows'",
  "streamlit>=1.32",
  "plotly>=5.20",
  "pyarrow>=15.0",
  "tqdm>=4.66",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
filo-extract   = "filo_hft.scripts.extract_history:main"
filo-backtest  = "filo_hft.scripts.run_backtest:main"
filo-sweep     = "filo_hft.scripts.run_sweep:main"
filo-train     = "filo_hft.scripts.train_ml:main"
filo-dashboard = "filo_hft.scripts.run_dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["filo_hft*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]
